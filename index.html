<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>제주 12월 동선 플래너</title>
<meta name="description" content="12/28~30 렌터카 2박 3일 · 귤밭·카트·마라도·우도·방어낚시·올레 동선을 고르고 효율을 계산하는 플래너">
<meta property="og:title" content="제주 12월 동선 플래너">
<meta property="og:description" content="귤밭·카트·마라도 짜장면·우도·방어낚시·올레 — 내가 고른 동선과 효율 점수">
<meta name="theme-color" content="#F1F3F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1312" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
/* 레이아웃: 상단 고정 점수판 + 탭, 아래는 탭별 화면. 일정 화면은 넓으면 3열, 좁으면 1열 */
:root {
  --bg: #F1F3F2; --surface: #FFFFFF; --surface-2: #E8ECEA; --ink: #17201D; --muted: #5A6762; --line: #D3DBD7;
  --accent: #E2680B; --accent-ink: #A94B03; --accent-soft: #FCE9D9;
  --sea: #0D6E7D; --sea-soft: #DAEEF0; --olle: #3B7A36; --navy: #26476E; --cam: #C2293F; --plum: #774B98; --view: #63742A; --food: #8A592A; --kart: #AE2F7A;
  --ok: #2B7A4B; --ok-soft: #DDF0E4; --warn: #A86300; --warn-soft: #FBEFD8; --err: #C02A38; --err-soft: #FADFE1;
  --d1: #E2680B; --d2: #0D6E7D; --d3: #774B98;
  --land: #DCE3DF; --land-line: #B9C6BF; --sea-map: #CFE3E6;
  --shadow: 0 1px 2px rgba(20,30,27,.06), 0 4px 14px rgba(20,30,27,.06);
  --f-display: 'Hahmlet', 'Noto Serif KR', 'AppleMyungjo', serif;
  --f-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 12px; --r-s: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1312; --surface: #161D1B; --surface-2: #1F2826; --ink: #E4ECE8; --muted: #98A7A1; --line: #2B3633;
    --accent: #FF8A33; --accent-ink: #FFB27A; --accent-soft: #3A2312;
    --sea: #4DB7C6; --sea-soft: #11333A; --olle: #7DBB75; --navy: #92B4DC; --cam: #FF6E84; --plum: #C49CE4; --view: #B6C66C; --food: #DCA56C; --kart: #F07CC0;
    --ok: #5EC489; --ok-soft: #133524; --warn: #E8A640; --warn-soft: #3A2A10; --err: #FF6C79; --err-soft: #3D1519;
    --d1: #FF8A33; --d2: #4DB7C6; --d3: #C49CE4;
    --land: #25302D; --land-line: #3A4844; --sea-map: #102326;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1312; --surface: #161D1B; --surface-2: #1F2826; --ink: #E4ECE8; --muted: #98A7A1; --line: #2B3633;
  --accent: #FF8A33; --accent-ink: #FFB27A; --accent-soft: #3A2312;
  --sea: #4DB7C6; --sea-soft: #11333A; --olle: #7DBB75; --navy: #92B4DC; --cam: #FF6E84; --plum: #C49CE4; --view: #B6C66C; --food: #DCA56C; --kart: #F07CC0;
  --ok: #5EC489; --ok-soft: #133524; --warn: #E8A640; --warn-soft: #3A2A10; --err: #FF6C79; --err-soft: #3D1519;
  --d1: #FF8A33; --d2: #4DB7C6; --d3: #C49CE4;
  --land: #25302D; --land-line: #3A4844; --sea-map: #102326;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--surface); z-index: 40; }
img, svg { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--sea); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono, .t { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.1rem; font-weight: 700; }
p { margin: 0; }
small, .small { font-size: .82rem; }
.muted { color: var(--muted); }
.eyebrow { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* ── 상단 ── */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 14px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand svg { flex: none; }
.brand h1 { font-size: 1.12rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand .sub { font-size: .78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-text { min-width: 0; }
.scorebox { display: flex; align-items: center; gap: 12px; flex: none; }
.score-num { font-family: var(--f-mono); font-weight: 600; font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.score-num small { font-size: .8rem; color: var(--muted); font-weight: 500; margin-left: 2px; }
.score-meta { display: grid; gap: 2px; font-size: .76rem; color: var(--muted); }
.score-meta b { color: var(--ink); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: .74rem; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.err { background: var(--err-soft); color: var(--err); }
.pill.info { background: var(--surface-2); color: var(--muted); }
.pill.acc { background: var(--accent-soft); color: var(--accent-ink); }
.delta { font-family: var(--f-mono); font-size: .78rem; font-weight: 600; white-space: nowrap; }
.delta.up { color: var(--ok); } .delta.down { color: var(--err); } .delta.same { color: var(--muted); }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 34px; height: 34px; display: inline-grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 9px 12px 10px; font-weight: 600; font-size: .9rem; color: var(--muted); cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:hover { color: var(--ink); }

/* ── 공통 ── */
main { padding-block: 18px 80px; }
.view { display: grid; gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid { display: grid; gap: 12px; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: .88rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.05); }
:root[data-theme="dark"] .btn.primary { color: #1b0d02; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #1b0d02; } }
.btn.sea { background: var(--sea); border-color: var(--sea); color: #fff; }
.btn.small { padding: 4px 10px; font-size: .8rem; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.field { display: grid; gap: 4px; font-size: .82rem; color: var(--muted); min-width: 0; }
.field select, .field input, .field textarea, select.sel { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-s); padding: 7px 9px; font-size: .9rem; color: var(--ink); min-width: 0; width: 100%; }
select.sel { width: auto; padding: 4px 8px; font-size: .8rem; border-radius: 999px; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: .86rem; cursor: pointer; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: .82rem; cursor: pointer; white-space: nowrap; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.badge { display: inline-flex; align-items: center; padding: 0 7px; border-radius: 6px; font-size: .72rem; font-weight: 700; white-space: nowrap; line-height: 1.6; color: #fff; background: var(--muted); }
.c-tang { --c: var(--accent); } .c-kart { --c: var(--kart); } .c-marado, .c-udo, .c-island { --c: var(--sea); } .c-fish { --c: var(--navy); } .c-olle { --c: var(--olle); } .c-flower { --c: var(--cam); } .c-rest { --c: var(--plum); } .c-view { --c: var(--view); } .c-food { --c: var(--food); }
.badge[class*="c-"] { background: var(--c); }
:root[data-theme="dark"] .badge[class*="c-"] { color: #111; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge[class*="c-"] { color: #111; } }
.zone { font-size: .76rem; color: var(--muted); white-space: nowrap; }
.note { font-size: .82rem; color: var(--muted); }
.callout { border-radius: var(--r-s); padding: 10px 12px; font-size: .86rem; background: var(--surface-2); }
.callout.warn { background: var(--warn-soft); }
.callout.sea { background: var(--sea-soft); }
.callout.acc { background: var(--accent-soft); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: .86rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; }
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.tbl { border-collapse: collapse; width: 100%; font-size: .86rem; }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: .76rem; color: var(--muted); font-weight: 600; white-space: nowrap; }
.tbl td.num, .tbl th.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tr.cur td { background: var(--accent-soft); }

/* ── 일정 ── */
.settings summary { cursor: pointer; font-weight: 700; font-family: var(--f-display); list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.settings summary::-webkit-details-marker { display: none; }
.settings summary .sum { font-family: var(--f-body); font-weight: 500; font-size: .82rem; color: var(--muted); }
.cfg-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
.lodgebar { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; align-items: end; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sugg { display: grid; gap: 6px; }
.sugg-item { display: flex; align-items: center; gap: 10px; justify-content: space-between; border: 1px dashed var(--line); border-radius: var(--r-s); padding: 8px 10px; }
.sugg-item .txt { min-width: 0; font-size: .88rem; }
.days { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
@media (max-width: 1080px) { .days { grid-template-columns: 1fr; } }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; min-width: 0; }
.day-head { padding: 12px 14px 10px; border-top: 4px solid var(--dc); display: grid; gap: 4px; }
.day-head h3 { display: flex; align-items: baseline; gap: 8px; }
.day-head h3 small { font-family: var(--f-body); font-weight: 500; color: var(--muted); font-size: .84rem; }
.day-stats { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .78rem; color: var(--muted); }
.day-stats b { color: var(--ink); font-weight: 600; }
.tl { list-style: none; margin: 0; padding: 4px 14px 12px; position: relative; }
.tl li { position: relative; padding-left: 58px; min-width: 0; }
.tl li::before { content: ""; position: absolute; left: 47px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.tl li:first-child::before { top: 14px; }
.tl li:last-child::before { bottom: calc(100% - 14px); }
.tl .tt { position: absolute; left: 0; top: 7px; width: 40px; text-align: right; font-family: var(--f-mono); font-size: .76rem; color: var(--muted); line-height: 1.25; font-variant-numeric: tabular-nums; }
.tl .dot { position: absolute; left: 41px; top: 9px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--dc); }
.tl .tl-start, .tl .tl-end { padding-block: 6px; font-size: .86rem; font-weight: 600; }
.tl .tl-drive { padding-block: 4px; font-size: .78rem; color: var(--muted); }
.tl .tl-drive .dot, .tl .tl-meal .dot, .tl .tl-free .dot { width: 8px; height: 8px; left: 44px; top: 11px; border-width: 0; background: var(--line); }
.tl .tl-meal, .tl .tl-free { padding-block: 5px; font-size: .82rem; }
.tl .tl-meal .box { background: var(--surface-2); border-radius: 6px; padding: 3px 8px; display: inline-block; }
.tl .tl-free { color: var(--muted); }
.act { padding-block: 6px; }
.act-card { border: 1px solid var(--line); border-radius: var(--r-s); padding: 9px 10px; display: grid; gap: 6px; background: var(--surface); }
.act-card.has-err { border-color: var(--err); }
.act-title { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; min-width: 0; }
.act-title strong { font-weight: 600; font-size: .92rem; min-width: 0; overflow-wrap: anywhere; }
.act-detail { font-size: .8rem; color: var(--muted); }
.issues { display: flex; flex-wrap: wrap; gap: 4px; }
.ctrl { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.ctrl .btn.small { padding: 3px 9px; }
.lock { font-size: .72rem; color: var(--accent-ink); border: 1px solid var(--accent-soft); background: var(--accent-soft); border-radius: 999px; padding: 0 7px; cursor: pointer; }
.alt { font-size: .76rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 8px; }
.day-foot { padding: 0 14px 14px; display: grid; gap: 8px; }
.planb { font-size: .8rem; }
.planb b { font-weight: 600; }

/* ── 카드 목록 ── */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
@media (max-width: 420px) { .cards { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.card.in-plan { border-color: var(--accent); }
.card h4 { font-size: 1rem; font-weight: 700; overflow-wrap: anywhere; }
.card .meta { display: grid; gap: 2px; font-size: .82rem; }
.card .meta div { display: grid; grid-template-columns: 52px 1fr; gap: 6px; }
.card .meta span:first-child { color: var(--muted); }
.card .foot { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: .72rem; padding: 0 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.tag.hot { background: var(--accent-soft); color: var(--accent-ink); }
.cat-bar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 4px; }

/* ── 베스트 ── */
.plans { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
@media (max-width: 420px) { .plans { grid-template-columns: 1fr; } }
.plan-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.plan-card .score-line { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.plan-card .big { font-family: var(--f-mono); font-size: 1.6rem; font-weight: 600; line-height: 1; }
.cover { display: flex; gap: 4px; flex-wrap: wrap; }
.cover span { font-size: .72rem; padding: 0 7px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
.cover span.on { border-color: transparent; background: var(--ok-soft); color: var(--ok); }
.cover span.off { color: var(--muted); text-decoration: line-through; }
.dayline { display: grid; grid-template-columns: 44px 1fr; gap: 6px; font-size: .82rem; }
.dayline b { color: var(--dc); font-weight: 700; }
.rank { font-family: var(--f-mono); color: var(--muted); font-size: .8rem; }

/* ── 지도 ── */
.map-wrap { position: relative; background: var(--sea-map); border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); }
.map-wrap svg { display: block; width: 100%; height: auto; }
.map-land { fill: var(--land); stroke: var(--land-line); stroke-width: 1.5; }
.map-zone { fill: none; stroke: var(--land-line); stroke-dasharray: 3 4; }
.map-zlabel { font-family: var(--f-body); font-size: 15px; font-weight: 600; fill: var(--muted); paint-order: stroke; stroke: var(--land); stroke-width: 4px; }
.map-dot { stroke: var(--surface); stroke-width: 1.5; cursor: pointer; }
.map-dot.dim { opacity: .35; }
.map-route { fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.map-ferry { fill: none; stroke-width: 2.5; stroke-dasharray: 5 5; }
.map-stop { stroke: var(--surface); stroke-width: 2; }
.map-stopnum { font-family: var(--f-mono); font-size: 13px; font-weight: 600; fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.map-mark-label { font-size: 13px; font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: var(--land); stroke-width: 4px; }
.map-hall { fill: none; stroke: var(--land-line); }
.map-hint { display: none; font-size: .78rem; color: var(--muted); margin-bottom: 6px; }

/* ── 실제 지도 (Leaflet) ── */
.lmap { position: relative; z-index: 0; height: min(64vh, 540px); border-radius: var(--r); border: 1px solid var(--line); background: var(--sea-map); }
.leaflet-container { font-family: var(--f-body); }
.leaflet-container img, .leaflet-container svg { max-width: none !important; }
.lmap .zl span { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; color: var(--muted); background: var(--surface); background: color-mix(in srgb, var(--surface) 82%, transparent); border: 1px solid var(--line); pointer-events: none; }
.lmap.zlo .zl { display: none; }
.lmap.dark .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.88) saturate(.7); }
.mk span { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; color: #fff; font: 600 13px/1 var(--f-mono); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
