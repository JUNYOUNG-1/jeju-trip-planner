<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>제주 12월 동선 플래너</title>
<meta name="description" content="12/28~30 렌터카 2박 3일 · 귤밭·카트·마라도·우도·방어낚시·올레 동선을 고르고 효율을 계산하는 플래너">
<meta property="og:title" content="제주 12월 동선 플래너">
<meta property="og:description" content="귤밭·카트·마라도 짜장면·우도·방어낚시·올레 — 내가 고른 동선과 효율 점수">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#202027" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
/* 화면 전체: 회색 바탕 위에 흰 카드. 한 가지 파란 강조색, 글꼴은 Pretendard 하나 */
:root {
  --bg: #F2F4F6; --surface: #FFFFFF; --surface-2: #F9FAFB; --fill: #F2F4F6; --fill-2: #E5E8EB;
  --ink: #191F28; --sub: #4E5968; --muted: #8B95A1; --faint: #B0B8C1; --line: #E5E8EB;
  --accent: #3182F6; --accent-press: #1B64DA; --accent-ink: #1B64DA; --accent-soft: #E8F3FF;
  --ok: #3182F6; --ok-soft: #E8F3FF; --warn: #E57B00; --warn-soft: #FFF4E5; --err: #F04452; --err-soft: #FFEEEE;
  --tang: #FF8A3D; --kart: #E8619A; --sea: #1EA5C8; --navy: #4C6EF5; --olle: #2BB673; --cam: #F04452; --plum: #8E6CF0; --view: #94A83B; --food: #B88355;
  --sea-soft: #E8F3FF;
  --d1: #3182F6; --d2: #14B8A6; --d3: #F59F00;
  --land: #E9EDF0; --land-line: #D1D6DB; --sea-map: #DCEBF5;
  --shadow: 0 2px 8px rgba(0, 27, 55, .06);
  --shadow-lg: 0 12px 40px rgba(0, 27, 55, .14);
  --f-body: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --f-display: var(--f-body); --f-mono: var(--f-body);
  --r: 20px; --r-m: 14px; --r-s: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17171C; --surface: #202027; --surface-2: #26262E; --fill: #2C2C35; --fill-2: #3C3C47;
    --ink: #F2F2F3; --sub: #C3C3C6; --muted: #8A8A93; --faint: #5E5E66; --line: #2C2C35;
    --accent: #4593FC; --accent-press: #3182F6; --accent-ink: #6AA8FF; --accent-soft: rgba(69, 147, 252, .16);
    --ok: #4593FC; --ok-soft: rgba(69, 147, 252, .16); --warn: #FFAA33; --warn-soft: rgba(255, 170, 51, .14); --err: #FF5E6C; --err-soft: rgba(255, 94, 108, .14);
    --sea-soft: rgba(69, 147, 252, .14);
    --land: #2A2F35; --land-line: #3A4048; --sea-map: #16222C;
    --shadow: 0 2px 8px rgba(0, 0, 0, .3); --shadow-lg: 0 12px 40px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17171C; --surface: #202027; --surface-2: #26262E; --fill: #2C2C35; --fill-2: #3C3C47;
  --ink: #F2F2F3; --sub: #C3C3C6; --muted: #8A8A93; --faint: #5E5E66; --line: #2C2C35;
  --accent: #4593FC; --accent-press: #3182F6; --accent-ink: #6AA8FF; --accent-soft: rgba(69, 147, 252, .16);
  --ok: #4593FC; --ok-soft: rgba(69, 147, 252, .16); --warn: #FFAA33; --warn-soft: rgba(255, 170, 51, .14); --err: #FF5E6C; --err-soft: rgba(255, 94, 108, .14);
  --sea-soft: rgba(69, 147, 252, .14);
  --land: #2A2F35; --land-line: #3A4048; --sea-map: #16222C;
  --shadow: 0 2px 8px rgba(0, 0, 0, .3); --shadow-lg: 0 12px 40px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--surface); z-index: 40; }
img, svg { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { -webkit-tap-highlight-color: transparent; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.mono, .t { font-variant-numeric: tabular-nums; }
h1, h2, h3, h4 { font-family: var(--f-body); text-wrap: balance; margin: 0; letter-spacing: -0.025em; color: var(--ink); }
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: 1.08rem; font-weight: 700; }
h4 { font-weight: 700; }
p { margin: 0; text-wrap: pretty; }
small, .small { font-size: .84rem; }
.muted { color: var(--muted); }
.eyebrow { font-size: .84rem; color: var(--muted); font-weight: 600; }

/* ── 상단 ── */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); box-shadow: 0 1px 0 var(--line); }
.top-row { display: flex; align-items: center; gap: 16px; padding-block: 14px 6px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand-text { min-width: 0; }
.brand h1 { font-size: 1.15rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand .sub { font-size: .82rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scorebox { display: flex; align-items: center; gap: 12px; flex: none; }
.score-num { font-weight: 700; font-size: 1.75rem; line-height: 1; letter-spacing: -0.03em; }
.score-num small { font-size: .9rem; color: var(--muted); font-weight: 600; margin-left: 2px; letter-spacing: 0; }
.score-meta { display: grid; gap: 1px; font-size: .78rem; color: var(--muted); }
.score-meta { justify-items: end; text-align: right; gap: 3px; }
.score-sub { font-size: .8rem; color: var(--muted); font-weight: 600; white-space: nowrap; }
.score-sub .bad { color: var(--err); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 6px; font-size: .76rem; font-weight: 600; white-space: nowrap; line-height: 1.4; }
.pill.ok, .pill.acc { background: var(--accent-soft); color: var(--accent-ink); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.err { background: var(--err-soft); color: var(--err); }
.pill.info { background: var(--fill); color: var(--sub); }
.delta { font-size: .82rem; font-weight: 600; white-space: nowrap; }
.delta.up { color: var(--accent); } .delta.down { color: var(--err); } .delta.same { color: var(--muted); }
.icon-btn { border: 0; background: var(--fill); color: var(--sub); border-radius: 12px; width: 36px; height: 36px; display: inline-grid; place-items: center; cursor: pointer; flex: none; transition: background-color .15s; }
.icon-btn:hover { background: var(--fill-2); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-inline: -8px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 12px 10px 13px; font-weight: 600; font-size: .95rem; color: var(--muted); cursor: pointer; white-space: nowrap; position: relative; transition: color .15s; }
.tab::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 2px; border-radius: 2px; background: transparent; }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"]::after { background: var(--ink); }
.tab:hover { color: var(--ink); }

/* ── 공통 ── */
main { padding-block: 20px 96px; }
.view { display: grid; gap: 12px; }
.panel { background: var(--surface); border-radius: var(--r); padding: 22px 22px 24px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid { display: grid; gap: 12px; }
.btn { border: 0; background: var(--fill); color: var(--sub); border-radius: 12px; padding: 10px 16px; font-weight: 600; font-size: .92rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; text-decoration: none; transition: background-color .15s, transform .1s; }
.btn:hover { background: var(--fill-2); text-decoration: none; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-press); }
.btn.sea { background: var(--accent); color: #fff; }
.btn.small { padding: 6px 11px; font-size: .84rem; border-radius: 10px; }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--fill); color: var(--sub); }
.btn[disabled] { opacity: .4; cursor: not-allowed; transform: none; }
.field { display: grid; gap: 6px; font-size: .84rem; color: var(--muted); font-weight: 500; min-width: 0; }
.field select, .field input, .field textarea, select.sel { border: 0; background: var(--fill); border-radius: 12px; padding: 11px 12px; font-size: .95rem; color: var(--ink); min-width: 0; width: 100%; font-weight: 500; }
.field select:focus, .field input:focus, .field textarea:focus, select.sel:focus { outline: 2px solid var(--accent); outline-offset: 0; }
select.sel { width: auto; padding: 6px 10px; font-size: .84rem; border-radius: 10px; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--sub); cursor: pointer; }
.check input { accent-color: var(--accent); width: 18px; height: 18px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 0; background: var(--fill); color: var(--sub); border-radius: 10px; padding: 7px 12px; font-size: .86rem; cursor: pointer; white-space: nowrap; font-weight: 600; transition: background-color .15s, color .15s; }
.chip:hover { background: var(--fill-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; font-weight: 600; white-space: nowrap; color: var(--muted); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c, var(--faint)); flex: none; }
.c-tang { --c: var(--tang); } .c-kart { --c: var(--kart); } .c-marado, .c-udo, .c-island { --c: var(--sea); } .c-fish { --c: var(--navy); } .c-olle { --c: var(--olle); } .c-flower { --c: var(--cam); } .c-rest { --c: var(--plum); } .c-view { --c: var(--view); } .c-food { --c: var(--food); }
.zone { font-size: .8rem; color: var(--muted); white-space: nowrap; }
.note { font-size: .86rem; color: var(--muted); }
.callout { border-radius: var(--r-m); padding: 12px 14px; font-size: .88rem; background: var(--fill); color: var(--sub); }
.callout.warn { background: var(--warn-soft); }
.callout.sea, .callout.acc { background: var(--accent-soft); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; font-size: .9rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; color: var(--ink); }
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.tbl { border-collapse: collapse; width: 100%; font-size: .88rem; }
.tbl th, .tbl td { text-align: left; padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: .8rem; color: var(--muted); font-weight: 600; white-space: nowrap; }
.tbl td.num, .tbl th.num { text-align: right; white-space: nowrap; }
.tbl tr.cur td { background: var(--accent-soft); }
.tbl tr:last-child td { border-bottom: 0; }

/* ── 일정 (자세히) ── */
.settings summary { cursor: pointer; font-weight: 700; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.settings summary::-webkit-details-marker { display: none; }
.settings summary::after { content: ""; width: 8px; height: 8px; border: solid var(--muted); border-width: 0 2px 2px 0; transform: rotate(45deg); flex: none; margin-left: auto; transition: transform .2s; }
.settings details[open] summary::after { transform: rotate(-135deg); }
.settings summary .sum { font-weight: 500; font-size: .84rem; color: var(--muted); }
.cfg-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 16px; }
.lodgebar { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; align-items: end; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sugg { display: grid; gap: 2px; }
.sugg-item { display: flex; align-items: center; gap: 10px; justify-content: space-between; border-radius: var(--r-m); padding: 12px 4px; border-bottom: 1px solid var(--line); }
.sugg-item:last-child { border-bottom: 0; }
.sugg-item .txt { min-width: 0; font-size: .92rem; color: var(--ink); }
.days { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start; }
@media (max-width: 1080px) { .days { grid-template-columns: 1fr; } }
.day { background: var(--surface); border-radius: var(--r); min-width: 0; }
.panel .day { background: var(--surface-2); }
.day-head { padding: 18px 18px 8px; display: grid; gap: 4px; }
.day-head h3 { display: flex; align-items: center; gap: 8px; font-size: 1.05rem; }
.day-head h3::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dc); flex: none; }
.day-head h3 small { font-weight: 500; color: var(--muted); font-size: .86rem; letter-spacing: 0; }
.day-stats { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: .82rem; color: var(--muted); }
.day-stats b { color: var(--sub); font-weight: 600; }
.tl { list-style: none; margin: 0; padding: 6px 18px 16px; position: relative; }
.tl li { position: relative; padding-left: 56px; min-width: 0; }
.tl li::before { content: ""; position: absolute; left: 47px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.tl li:first-child::before { top: 14px; }
.tl li:last-child::before { bottom: calc(100% - 14px); }
.tl .tt { position: absolute; left: 0; top: 8px; width: 38px; text-align: right; font-size: .78rem; color: var(--muted); line-height: 1.3; font-weight: 500; }
.tl .dot { position: absolute; left: 43px; top: 11px; width: 10px; height: 10px; border-radius: 50%; background: var(--dc); box-shadow: 0 0 0 3px var(--surface); }
.panel .tl .dot { box-shadow: 0 0 0 3px var(--surface-2); }
.tl .tl-start, .tl .tl-end { padding-block: 7px; font-size: .9rem; font-weight: 600; }
.tl .tl-drive { padding-block: 4px; font-size: .82rem; color: var(--muted); }
.tl .tl-drive .dot, .tl .tl-meal .dot, .tl .tl-free .dot { width: 6px; height: 6px; left: 45px; top: 12px; background: var(--faint); }
.tl .tl-meal, .tl .tl-free { padding-block: 6px; font-size: .86rem; color: var(--sub); }
.tl .tl-meal .box { background: none; padding: 0; }
.tl .tl-free { color: var(--muted); }
.act { padding-block: 6px; }
.act-card { border-radius: var(--r-m); padding: 12px 14px; display: grid; gap: 6px; background: var(--fill); }
.act-card.has-err { box-shadow: inset 0 0 0 1.5px var(--err); }
.act-title { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; min-width: 0; }
.act-title strong { font-weight: 700; font-size: .96rem; min-width: 0; overflow-wrap: anywhere; }
.act-detail { font-size: .84rem; color: var(--muted); }
.issues { display: flex; flex-wrap: wrap; gap: 4px; }
.ctrl { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.ctrl .btn.small { padding: 5px 10px; background: var(--surface); }
.ctrl .btn.small:hover { background: var(--fill-2); }
.ctrl select.sel { background: var(--surface); }
.lock { font-size: .76rem; color: var(--accent-ink); border: 0; background: var(--accent-soft); border-radius: 6px; padding: 2px 7px; cursor: pointer; font-weight: 600; }
.alt { font-size: .8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 8px; }
.day-foot { padding: 0 18px 18px; display: grid; gap: 8px; }
.planb { font-size: .84rem; }
.planb b { font-weight: 600; }

/* ── 카드 목록 ── */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
@media (max-width: 420px) { .cards { grid-template-columns: 1fr; } }
.card { background: var(--surface); border-radius: var(--r); padding: 20px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.modal .card, .panel .card { background: var(--surface-2); padding: 18px; }
.card.in-plan { box-shadow: inset 0 0 0 2px var(--accent); }
.card h4 { font-size: 1.02rem; overflow-wrap: anywhere; }
.card .meta { display: grid; gap: 4px; font-size: .86rem; }
.card .meta div { display: grid; grid-template-columns: 56px 1fr; gap: 8px; }
.card .meta span:first-child { color: var(--muted); }
.card .foot { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: .76rem; padding: 2px 7px; border-radius: 6px; background: var(--fill); color: var(--sub); white-space: nowrap; font-weight: 500; }
.tag.hot { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.cat-bar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.cat-bar::-webkit-scrollbar { display: none; }

/* ── 베스트 ── */
.plans { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
@media (max-width: 420px) { .plans { grid-template-columns: 1fr; } }
.plan-card { background: var(--surface); border-radius: var(--r); padding: 22px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.plan-card.cur { box-shadow: inset 0 0 0 2px var(--accent); }
.plan-card h3 { font-size: 1.12rem; }
.plan-card .score-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.plan-card .big { font-size: 1.9rem; font-weight: 700; line-height: 1; letter-spacing: -0.03em; }
.cover { display: flex; gap: 4px; flex-wrap: wrap; }
.cover span { font-size: .76rem; padding: 2px 7px; border-radius: 6px; white-space: nowrap; font-weight: 600; }
.cover span.on { background: var(--accent-soft); color: var(--accent-ink); }
.cover span.off { background: var(--fill); color: var(--faint); text-decoration: line-through; }
.dayline { display: grid; grid-template-columns: 46px 1fr; gap: 6px; font-size: .86rem; color: var(--sub); }
.dayline b { color: var(--ink); font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.dayline b::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--dc); }
.rank { color: var(--muted); font-size: .84rem; font-weight: 600; }

/* ── 지도 ── */
.map-wrap { position: relative; background: var(--sea-map); border-radius: var(--r-m); overflow: hidden; }
.map-wrap svg { display: block; width: 100%; height: auto; }
.map-land { fill: var(--land); stroke: var(--land-line); stroke-width: 1.5; }
.map-zone { fill: none; stroke: var(--land-line); stroke-dasharray: 3 4; }
.map-zlabel { font-family: var(--f-body); font-size: 15px; font-weight: 600; fill: var(--muted); paint-order: stroke; stroke: var(--land); stroke-width: 4px; }
.map-dot { stroke: var(--surface); stroke-width: 1.5; cursor: pointer; }
.map-dot.dim { opacity: .35; }
.map-route { fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.map-ferry { fill: none; stroke-width: 2.5; stroke-dasharray: 5 5; }
.map-stop { stroke: var(--surface); stroke-width: 2; }
.map-stopnum { font-size: 13px; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.map-mark-label { font-size: 13px; font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: var(--land); stroke-width: 4px; }
.map-hall { fill: none; stroke: var(--land-line); }
